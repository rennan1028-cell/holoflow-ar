name: HoloFlowAR
options:
  bundleIdPrefix: com.holoflow
  deploymentTarget:
    iOS: "17.0"
targets:
  HoloFlowAR:
    type: application
    platform: iOS
    sources:
      - HoloFlowAR
    info:
      path: HoloFlowAR/Info.plist
      properties:
        CFBundleDisplayName: HOLOFLOW
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarHidden: true
        NSCameraUsageDescription: "A camera mostra a cidade do livro de ofertas presa na sua mesa."
        NSLocalNetworkUsageDescription: "Para receber o MNQ ao vivo do servidor HOLOFLOW no seu PC (mesma rede Wi-Fi)."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holoflow.ar
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
